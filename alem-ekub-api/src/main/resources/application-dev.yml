server:
  port: 8088
  tomcat:
    max-connections: 10000
    accept-count: 10000
    threads:
      max: 20
spring:
  application:
    name: alem-ekub-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alem_ekub_db}
    username: ${SPRING_DATASOURCE_USERNAME:hab}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8 # down form 10, b/c pgBouncer connection pool
      minimum-idle: 2
      connection-timeout: 30000   # 30 second
      leak-detection-threshold: 5000  # enable hikari leak detection
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
         issuer-uri: ${OAUTH2_JWT_ISSUER_URI:http://host.docker.internal:9090/realms/alem-ekub}
         jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://host.docker.internal:9090/realms/alem-ekub/protocol/openid-connect/certs}

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:9090}
  realm: ${KEYCLOAK_REALM:alem-ekub}
  client-id: ${KEYCLOAK_CLIENT_ID:api-service}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:mztotjdj2zSvizLBaJw1MWSztEKKRVh7}

s3:
  space-access-key: ${S3_SPACES_ACCESS_KEY:DOSomething}
  space-secret-key: ${S3_SPACES_SECRET_KEY:Zsomething}
  space-endpoint:  ${S3_SPACES_ENDPOINT:https://image.com}
  bucket-name: ${S3_BUCKET_NAME:photoss}
  region: ${S3_REGION:Eh1}

application:
  server:
    url: ${SERVER_URL:http://localhost:8088/api/v1}
  cors:
    origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  file:
    path: ${FILE_PATH:./photo}


logging:
  level:
    org:
      springframework.security.oauth2.jwt: DEBUG
      springframework.security: DEBUG
      keycloak: DEBUG
      apache.http: DEBUG
      apache.http.wire: ERROR






