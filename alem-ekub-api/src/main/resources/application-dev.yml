server:
  port: 8088
  tomcat:
    max-connections: 10000
    accept-count: 10000
    threads:
      max: 20
spring:
  application:
    name: alem-ekub-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alem_ekub_db}
    username: ${SPRING_DATASOURCE_USERNAME:hab}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8 # down form 10, b/c pgBouncer connection pool
      minimum-idle: 2
      connection-timeout: 30000   # 30 second
      leak-detection-threshold: 5000  # enable hikari leak detection
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
         issuer-uri: ${OAUTH2_JWT_ISSUER_URI:https://alem-equb.duckdns.org/keycloak/realms/alem-ekub}
         jwk-set-uri: ${OAUTH2_JWK_SET_URI:https://alem-equb.duckdns.org/keycloak/realms/alem-ekub/protocol/openid-connect/certs}

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:https://alem-equb.duckdns.org/keycloak}
  realm: ${KEYCLOAK_REALM:alem-ekub}
  client-id: ${KEYCLOAK_CLIENT_ID:api-client}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:kwJ81Vi67cXc2v88mN6mlky6a3yrbi8b}

s3:
  space-access-key: ${S3_SPACES_ACCESS_KEY:some-key}
  space-secret-key: ${S3_SPACES_SECRET_KEY:some-secret}
  space-endpoint:  ${S3_SPACES_ENDPOINT:https://alem-equb.duckdns.org}
  bucket-name: ${S3_BUCKET_NAME:name}
  region: ${S3_REGION:ETH}

application:
  server:
    url: ${SERVER_URL:http://localhost:8088/api/v1}
  cors:
    origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  file:
    path: ${FILE_PATH:./photo}


logging:
  level:
    org:
      springframework:
        security: DEBUG
      keycloak: DEBUG





