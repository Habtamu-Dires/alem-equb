name: Alem Frontend Pipeline

on:
  push:
    branches:
      - pipeline
    paths:
      - alem-ekub-ui/**
      - docker/frontend/**
      - 'docker-compose.yml'
      - .github/workflows/*-frontend.yml

jobs:
  build-image:
    name: build frontend docker image
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: extract project version
        id: extract_version
        run: |
          cd alem-ekub-ui
          echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

